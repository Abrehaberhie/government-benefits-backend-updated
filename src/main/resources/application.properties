spring.application.name=government-benefits

spring.config.import=classpath:eligibility-rules.yml

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/government_benefits_db
spring.datasource.username=abreha
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Application server
server.port=8080


# Keep internal error details out of API responses
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Set mail settings using the IntelliJ run configuration to enable password reset email.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:4200}
